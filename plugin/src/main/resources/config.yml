# WorldEditSelectionVisualizer configuration file

# When enabled, a message will be displayed in the console on startup if a new update is available
check-updates: true

# You can edit the plugin messages below
messages:
  no-permissions: "&cYou don't have permission to use this command."
  config-reloaded: "&aThe configuration was reloaded."
  selection-too-large: "&6The visualizer only works with selections up to %blocks% blocks in size."
  visualizer-enabled: "&6Your visualizer has been &aenabled&6."
  visualizer-disabled: "&6Your visualizer has been &cdisabled&6."
  visualizer-clipboard-enabled: "&6Your clipboard visualizer has been &aenabled&6."
  visualizer-clipboard-disabled: "&6Your clipboard visualizer has been &cdisabled&6."
  lock-enabled: "&6Clipboard origin lock is now &aenabled &6at your current position. Use &3/wesv lock tp &6to return to this position."
  lock-disabled: "&6Clipboard origin lock is now &cdisabled&6."
  lock-no-position: "&cClipboard origin lock is not enabled."

# When enabled, if a player disables selection visualization and leaves the server, then
# when they return, selection visualization will remain disabled until they enable it again with /wesv toggle.
save-toggle: true

# The default visualization states for new players or when 'save-toggle' is set to false
default-enabled:
  selection: true
  clipboard: false

# Delay in ticks between WorldEdit selection and clipboard updates.
# This doesn't affect particle spawning or player performance. The server impact is moderate.
selection-update-interval: 20

# When enabled, particles are displayed only while holding the WorldEdit selection wand item (a wooden axe by default)
# You can change the WorldEdit wand item in the WorldEdit configuration file
need-we-wand: false

# When enabled, top and bottom particles will be displayed for cuboid selections
cuboid-top-bottom: false

# Visualization settings
# 'selection': The player's current WorldEdit selection
# 'clipboard': The WorldEdit clipboard (when using //copy or //schem load)
#   'fade-delay': The number of seconds before particles disappear. Set it to 0 to disable the fade delay
#   'max-selection-size': The maximum selection size to display. A large value (> 1000000) can cause significant lag
#   'primary': The primary selection points (the region boundaries)
#   'secondary': The secondary selection points (the intermediate lines between the borders)
#   'origin': The selection origin point (position 1 for cuboid selections, and the center for ellipsoids/cylinders)
#     'points-distance': The distance between particles. Higher values spawn fewer particles
#     'lines-gap' (secondary selection only): The distance between particle lines on cuboids and polygons. Higher values spawn fewer particles. Set it to 0 to remove cuboid lines
#     'update-interval': The delay in ticks between particle updates. Higher values improve player performance
#     'view-distance': The maximum distance at which players can see particles. On 1.7.10, the particle distance is limited to 16 (Minecraft limitation)
#     'particles': The particle type and data. Data can be a color for redstone particles in the format 'r,g,b' or a Material for block/item crack effects
#       Available particle types: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html
visualization:
  selection:
    fade-delay: 0
    max-selection-size: 50000
    primary:
      points-distance: 1.0
      update-interval: 12
      view-distance: 64
      particles:
        type: "FLAME"
        data: ""
    secondary:
      points-distance: 3.0
      lines-gap: 5.0
      update-interval: 18
      view-distance: 32
      particles:
        type: "REDSTONE"
        data: "RED"
    origin:
      update-interval: 15
      view-distance: 64
      particles:
        type: "VILLAGER_HAPPY"
        data: ""
  clipboard:
    fade-delay: 0
    max-selection-size: 50000
    primary:
      points-distance: 1.0
      update-interval: 12
      view-distance: 64
      particles:
        type: "FLAME"
        data: ""
    secondary:
      points-distance: 3.0
      lines-gap: 5.0
      update-interval: 18
      view-distance: 32
      particles:
        type: "REDSTONE"
        data: "BLUE"
    origin:
      update-interval: 15
      view-distance: 64
      particles:
        type: "VILLAGER_HAPPY"
        data: ""
